name: Reference architecture
description: Comment on the second paper, the reference architecture for the software factory. Say what is wrong and, where you can, what would make it right.
labels: ["software-factory"]
body:
  - type: dropdown
    id: boundary
    attributes:
      label: Part of the paper
      description: Leave blank if the comment cuts across the paper.
      options:
        - Identity and access
        - Supply chain
        - Sandbox
        - Network
        - Execution and observability
        - "Level 1: Human-Orchestrated Factory"
        - "Level 2: Workflow-Orchestrated Factory"
        - "Level 3: Agent-Orchestrated Factory"
    validations:
      required: false
  - type: textarea
    id: comment
    attributes:
      label: Comment
    validations:
      required: true
