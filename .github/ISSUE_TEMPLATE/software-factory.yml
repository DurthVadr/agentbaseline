name: Reference architecture
description: Comment on the second paper, the reference architecture for the software factory. Say what is wrong and, where you can, what would make it right.
labels: ["software-factory"]
body:
  - type: dropdown
    id: primitive
    attributes:
      label: Primitive
      description: Leave blank if the comment cuts across the paper. These are the names in software-factory/primitives.yaml.
      options:
        - Identity and access
        - Supply chain
        - Network
        - Runtime isolation
        - Orchestration
    validations:
      required: false
  - type: textarea
    id: comment
    attributes:
      label: Comment
    validations:
      required: true
