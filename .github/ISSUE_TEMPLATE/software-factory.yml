name: Reference architecture
description: Comment on the second paper, the reference architecture for the software factory. Say what is wrong and, where you can, what would make it right.
labels: ["software-factory"]
body:
  - type: dropdown
    id: boundary
    attributes:
      label: Boundary
      description: Leave blank if the comment cuts across the paper. These are the paper's four security boundaries, as named in software-factory/boundaries.yaml.
      options:
        - Identity and access
        - Supply chain
        - Sandbox
        - Network
    validations:
      required: false
  - type: textarea
    id: comment
    attributes:
      label: Comment
    validations:
      required: true
