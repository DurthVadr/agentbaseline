  <text x="288" y="186" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="#5A5E5A" font-weight="400">Assembled from agents and harnesses, models, skills,</text>
  <text x="288" y="200.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="#5A5E5A" font-weight="400">tools and MCP servers, dependencies and blueprints</text>
