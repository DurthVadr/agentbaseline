<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 324" width="736" height="324" role="img" aria-labelledby="sf1-t sf1-d">
  <title id="sf1-t">Work loops until it passes, and problems feed back to design</title>
  <desc id="sf1-d">Work arrives as a prompt, a PRD or a ticket, and design sets its limits. The inner loop assembles what the task needs, builds the change in a sandbox and verifies it, repeating until the work passes. Review and approval policy decide what deploys. The outer loop feeds review, evals and production feedback back into design, and production sends back signals that start new work.</desc>
