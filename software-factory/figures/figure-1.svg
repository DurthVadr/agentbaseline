  <text x="377.0" y="28" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="#5A5E5A" font-weight="400">repeats until the work passes</text>
  <rect x="288.5" y="40.5" width="120.333" height="63" rx="4" fill="none" stroke="#CBCDC8" stroke-width="1"/>
  <text x="298.0" y="61" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Assemble</text>
  <text x="298.0" y="77.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="#5A5E5A" font-weight="400">what the task</text>
