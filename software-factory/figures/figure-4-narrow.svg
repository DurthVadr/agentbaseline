  <path d="M348 610 L326 610" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <path d="M348 666 L326 666" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <path d="M74 688 L74 716" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <rect x="24.5" y="716.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="737.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Pull request</text>
  <text x="34" y="753.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">reviewed until ready</text>
  <path d="M74 762 L74 784" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <rect x="24.5" y="784.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="805.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Approval</text>
  <text x="34" y="821.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">a person or automatic</text>
  <path d="M74 830 L74 852" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <rect x="24.5" y="852.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="873.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Merge</text>
  <text x="34" y="889.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">approved changes</text>
  <path d="M74 898 L74 922 L4 922 L4 117 L24 117" fill="none" stroke="#5A5E5A" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#sf4n-s)"/>
  <text x="84" y="914.0" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12.5" fill="#5A5E5A" font-weight="500" letter-spacing="0.04em">OUTER LOOP</text>
  <text x="84" y="936.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">review feedback drives the next run</text>
  <rect x="24.5" y="954.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="974.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Observability</text>
  <text x="34" y="990.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">records from all four boundaries, by run</text>
