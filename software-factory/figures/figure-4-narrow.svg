<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 1018" width="376" height="1018" role="img" aria-labelledby="sf4n-t sf4n-d">
  <title id="sf4n-t">Level 2, where a workflow orchestrates</title>
  <desc id="sf4n-d">A request, event, schedule or ticket starts a workflow on CI/CD or a durable execution engine, which runs a coding agent in a fresh sandbox, behind its own proxy, for each run; the pull request goes through approval to merge, and review feedback starts the next run. The authorization service, proxy and destinations are the same as at Level 1.</desc>
  <rect width="376" height="1018" fill="#FFFFFF"/>
  <defs><marker id="sf4n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#797D79"/></marker><marker id="sf4n-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A7A00"/></marker><marker id="sf4n-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A5E5A"/></marker></defs>
  <g transform="translate(8 8)">
  <rect x="24.5" y="10.5" width="335" height="51" rx="4" fill="none" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="24" cy="10" r="8" fill="#5A7A00"/>
  <text x="20.7" y="13.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">1</text>
  <text x="34" y="31" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Runtime authorization service</text>
  <text x="34" y="47.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">decides what access each task gets</text>
  <rect x="24.5" y="84.5" width="189" height="65" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="105" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Request</text>
  <text x="34" y="121.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">or an event, a schedule</text>
  <text x="34" y="135.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">or a ticket</text>
  <text x="88" y="196" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12.5" fill="#5A5E5A" font-weight="500" letter-spacing="0.04em">THE FACTORY</text>
  <rect x="36.5" y="214.5" width="177" height="65" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="46" y="235" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Workflow</text>
  <text x="46" y="251.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">on CI/CD or a durable</text>
  <text x="46" y="265.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">execution engine</text>
  <path d="M74 150 L74 214" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <rect x="42.5" y="310.5" width="171" height="125" rx="4" fill="#FFFFFF" stroke="#5A7A00" stroke-width="0.75"/>
  <rect x="39.5" y="307.5" width="171" height="125" rx="4" fill="#FFFFFF" stroke="#5A7A00" stroke-width="0.75"/>
  <rect x="36.5" y="304.5" width="171" height="125" rx="4" fill="#F1F2EC" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="36" cy="304" r="8" fill="#5A7A00"/>
  <text x="32.7" y="307.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">3</text>
  <text x="50" y="328" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12.5" fill="#5A5E5A" font-weight="500" letter-spacing="0.04em">SANDBOX PER RUN</text>
  <text x="50" y="354" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Coding agent</text>
  <text x="50" y="370.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">own identity</text>
  <text x="50" y="384.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">and profile</text>
  <path d="M61.98 399.82 A6.5 6.5 0 1 1 54.78 397.89" fill="none" stroke="#797D79" stroke-width="1.2"/>
  <path d="M58.16 396.66 L55.67 400.34 L53.89 395.45 z" fill="#797D79"/>
  <text x="72" y="408.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">inner loop,</text>
  <text x="72" y="422.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">until it passes</text>
  <path d="M74 280 L74 304" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <rect x="24.5" y="174.5" width="335" height="277" rx="4" fill="none" stroke="#797D79" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="238.5" y="330.5" width="103" height="83" rx="4" fill="#FFFFFF" stroke="#5A7A00" stroke-width="0.75"/>
  <rect x="235.5" y="327.5" width="103" height="83" rx="4" fill="#FFFFFF" stroke="#5A7A00" stroke-width="0.75"/>
  <rect x="232.5" y="324.5" width="103" height="83" rx="4" fill="#FFFFFF" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="232" cy="324" r="8" fill="#5A7A00"/>
  <text x="228.7" y="327.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">4</text>
  <text x="242" y="345" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Egress proxy</text>
  <text x="242" y="361.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">default-deny;</text>
  <text x="242" y="375.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">attaches</text>
  <text x="242" y="390.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">credentials</text>
  <path d="M208 366 L232 366" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf4n-a)"/>
  <path d="M300 62 L300 324" fill="none" stroke="#5A7A00" stroke-width="1.25" stroke-dasharray="5 3" marker-end="url(#sf4n-g)"/>
  <rect x="24.5" y="476.5" width="301" height="43" rx="4" fill="none" stroke="#5A7A00" stroke-width="1.25"/>
  <text x="34" y="497.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Model gateway</text>
  <text x="34" y="513.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">approved models</text>
  <rect x="24.5" y="532.5" width="301" height="43" rx="4" fill="none" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="24" cy="532.0" r="8" fill="#5A7A00"/>
  <text x="20.7" y="535.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">2</text>
  <text x="34" y="553.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Admission point</text>
  <text x="34" y="569.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">approved, scanned packages</text>
  <rect x="24.5" y="588.5" width="301" height="43" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="609.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Services</text>
  <text x="34" y="625.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">the task needs</text>
  <rect x="24.5" y="644.5" width="301" height="43" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="665.0" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Source control</text>
  <text x="34" y="681.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">the repository</text>
