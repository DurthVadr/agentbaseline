  <rect x="600.5" y="124.5" width="119" height="43" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="610" y="145" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Source control</text>
  <text x="610" y="161.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.25" fill="#5A5E5A" font-weight="400">the repository</text>
