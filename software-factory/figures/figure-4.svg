  <path d="M286.16 226.66 L283.67 230.34 L281.89 225.45 z" fill="#797D79"/>
  <text x="300" y="238" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.25" fill="#5A5E5A" font-weight="400">inner loop,</text>
  <text x="300" y="252.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.25" fill="#5A5E5A" font-weight="400">until it passes</text>
