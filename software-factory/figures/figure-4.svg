<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 592" width="736" height="592" role="img" aria-labelledby="sf4-t sf4-d">
  <title id="sf4-t">Level 2, where a workflow orchestrates</title>
  <desc id="sf4-d">A request, event, schedule or ticket starts a workflow on CI/CD or a durable execution engine, which runs a coding agent in a fresh sandbox, behind its own proxy, for each run; the pull request goes through approval to merge, and review feedback starts the next run. The authorization service, proxy and destinations are the same as at Level 1.</desc>
  <rect width="736" height="592" fill="#FFFFFF"/>
