  <text x="274" y="445.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.25" fill="#5A5E5A" font-weight="400">until ready</text>
  <rect x="388.5" y="394.5" width="87" height="55" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
