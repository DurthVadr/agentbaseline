<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 1036" width="376" height="1036" role="img" aria-labelledby="sf6n-t sf6n-d">
  <title id="sf6n-t">Only a new authorization decision can widen a task</title>
  <desc id="sf6n-d">A production alert leads the orchestrator to schedule a task for an incident agent on the durable execution layer, which starts the agent in its sandbox, and to propose the task's scope, one service's logs for the last hour and one pull request, which the authorization service checks against policy and the alert's source. When the agent reaches for another service's logs, the proxy blocks the call, because only a new authorization decision could widen the task; the fix ships through approval and a small first deploy, and the error rate afterward confirms it or starts the next run.</desc>
