  <rect x="36.5" y="348.5" width="177" height="131" rx="4" fill="#F1F2EC" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="36" cy="348" r="8" fill="#5A7A00"/>
  <text x="32.7" y="351.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">3</text>
  <text x="50" y="372" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12.5" fill="#5A5E5A" font-weight="500" letter-spacing="0.04em">SANDBOX</text>
  <text x="50" y="398" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Incident agent</text>
  <text x="50" y="414" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">configured from</text>
  <text x="50" y="428.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">its profile</text>
  <path d="M61.98 445.82 A6.5 6.5 0 1 1 54.78 443.89" fill="none" stroke="#797D79" stroke-width="1.2"/>
  <path d="M58.16 442.66 L55.67 446.34 L53.89 441.45 z" fill="#797D79"/>
  <text x="72" y="454" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">inner loop,</text>
  <text x="72" y="468.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">until tests pass</text>
  <path d="M214 372 L226 372 L226 76" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <text x="234" y="248" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">needs</text>
  <text x="234" y="262.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">a new</text>
  <text x="234" y="277" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">decision</text>
  <rect x="36.5" y="504.5" width="315" height="59" rx="4" fill="none" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="36" cy="504" r="8" fill="#5A7A00"/>
  <text x="32.7" y="507.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">4</text>
  <text x="46" y="525" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Egress proxy</text>
  <text x="46" y="541.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">enforces it, attaches credentials</text>
  <path d="M74 480 L74 504" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <path d="M340 76 L340 504" fill="none" stroke="#5A7A00" stroke-width="1.25" stroke-dasharray="5 3" marker-end="url(#sf6n-g)"/>
  <rect x="24.5" y="188.5" width="335" height="391" rx="4" fill="none" stroke="#797D79" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="24.5" y="604.5" width="297" height="43" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="625" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Payments service logs</text>
  <text x="34" y="641.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">last hour only</text>
  <rect x="24.5" y="660.5" width="297" height="43" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="34" y="681" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Authentication service logs</text>
  <text x="34" y="697.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">blocked: outside the task</text>
  <rect x="24.5" y="716.5" width="297" height="43" rx="4" fill="none" stroke="#5A7A00" stroke-width="1.25"/>
  <circle cx="24" cy="716" r="8" fill="#5A7A00"/>
  <text x="20.7" y="719.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFFFFF" font-weight="600">2</text>
  <text x="34" y="737" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Admission point</text>
  <text x="34" y="753.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">serves the approved library</text>
  <rect x="24.5" y="788.5" width="297" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="809" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Pull request</text>
  <text x="34" y="825.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">one, as granted</text>
  <path d="M342 564 L342 811" fill="none" stroke="#797D79" stroke-width="1.1"/>
  <path d="M342 626 L322 626" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <path d="M342 682 L322 682" fill="none" stroke="#797D79" stroke-width="1.1"/>
