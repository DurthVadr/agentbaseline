  <path d="M342 738 L322 738" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <path d="M342 811 L322 811" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <path d="M74 834 L74 856" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <rect x="24.5" y="856.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="877" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Approval</text>
  <text x="34" y="893.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">a person or automatic</text>
  <path d="M74 902 L74 924" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <rect x="24.5" y="924.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="945" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Deploy</text>
  <text x="34" y="961.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">small share of traffic first</text>
  <path d="M74 970 L74 992" fill="none" stroke="#797D79" stroke-width="1.1" marker-end="url(#sf6n-a)"/>
  <rect x="24.5" y="992.5" width="335" height="45" rx="4" fill="none" stroke="#8F8A7C" stroke-width="1"/>
  <text x="34" y="1013" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="#1A1C1A" font-weight="600">Production</text>
  <text x="34" y="1029.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">error rate afterward</text>
  <path d="M74 1038 L74 1062 L4 1062 L4 131 L24 131" fill="none" stroke="#5A5E5A" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#sf6n-s)"/>
  <text x="84" y="1054" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="12.5" fill="#5A5E5A" font-weight="500" letter-spacing="0.04em">OUTER LOOP</text>
  <text x="84" y="1076" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">confirms the fix or</text>
  <text x="84" y="1090.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="12.5" fill="#5A5E5A" font-weight="400">starts the next run</text>
