<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 762" width="376" height="762" role="img" aria-labelledby="sf2n-t sf2n-d">
  <title id="sf2n-t">The agent proposes, policy authorizes, and infrastructure enforces</title>
  <desc id="sf2n-d">An agent in a sandbox, holding no credentials, proposes the scope it needs; the runtime authorization service decides within the bounds of the agent's profile, using trusted context: the agent and whoever it acts for, its task, any delegation and policy. The egress proxy enforces that decision and attaches the credentials, so only authorized operations reach anything downstream and packages come only through an admission point. High-impact actions go to an approval the agent can't give, anything outside policy is denied or sent to a person, and every grant is recorded. The profile also configures the sandbox at launch, and each boundary keeps a tamper-evident record.</desc>
