<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 526" width="736" height="526" role="img" aria-labelledby="sf6-t sf6-d">
  <title id="sf6-t">Only a new authorization decision can widen a task</title>
  <desc id="sf6-d">A production alert reports elevated errors in a payments service. The orchestrator agent proposes a task for an incident agent: read the service's logs for the last hour and open one pull request. The runtime authorization service checks it against policy and the alert's authenticated source, and the egress proxy attaches credentials only to the requests it grants. When the agent reaches for an unrelated authentication service's logs, the task doesn't cover them and the proxy blocks the call; only a new authorization decision could widen the task. The fix uses a library admitted through the supply chain and leaves as a pull request that approval policy routes to a person or approves automatically. The deploy reaches a small share of traffic first, and the error rate afterward confirms the fix or starts the next run.</desc>
