<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 600" width="736" height="600" role="img" aria-labelledby="sf6-t sf6-d">
  <title id="sf6-t">Only a new authorization decision can widen a task</title>
  <desc id="sf6-d">A production alert leads the orchestrator to propose a task for an incident agent, one service's logs for the last hour and one pull request, which the authorization service checks against policy and the alert's source. When the agent reaches for another service's logs, the proxy blocks the call, because only a new authorization decision could widen the task; the fix ships through approval and a small first deploy, and the error rate afterward confirms it or starts the next run.</desc>
