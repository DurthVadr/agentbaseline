<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 672" width="736" height="672" role="img" aria-labelledby="sf3-t sf3-d">
  <title id="sf3-t">Level 1, where a developer gives an agent room to work without giving it everything the developer can reach</title>
  <desc id="sf3-d">A developer kicks off each run of one coding agent, an agent harness built from skills, tools, hooks and context files and configured by its profile, in a sandbox on their machine or a remote environment. The agent proposes the scope it needs, and a default-deny egress proxy enforces the authorization service's decision on every request it makes to the supply chain firewall, a model gateway, source control, APIs and MCP servers; its pull request goes back to the developer, who drives the next run.</desc>
