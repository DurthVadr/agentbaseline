<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 656" width="736" height="656" role="img" aria-labelledby="sf3-t sf3-d">
  <title id="sf3-t">Level 1, where a developer gives an agent room to work without giving it everything the developer can reach</title>
  <desc id="sf3-d">A developer directs one coding agent in a sandbox on their machine or a remote environment, and every request it makes goes through a default-deny egress proxy that enforces the authorization service's decision. The agent can reach source control, the services its task needs, a model gateway and approved packages, and nothing else the developer can reach; its pull request goes back to the developer.</desc>
  <rect width="736" height="656" fill="#FFFFFF"/>
