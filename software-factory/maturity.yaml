# The three maturity levels, as the paper's Maturity Model describes them
# (Draft 3, 5 October, lines 387–447). Levels 1 and 2 carry the paper's
# names; level 3 carries the name the working group settled on, "Factory as
# orchestrator" (the draft's heading still reads "The Orchestrated Factory").
#
# /reference-architecture shows one level at a time: a one-line header, then
# the five stages down the side with what the level does at each. The stages
# are the same at every level; what a level changes is the text beside them.
#
#   stages   the paper's five stages, in order (lines 344–383). `op` marks
#            the three the paper groups as the factory's operation.
#   levels   in order, lowest first:
#     name     the level's name
#     header   where the factory runs and who coordinates the agents
#     repeat   true when the factory's operation can run more than once
#              (line 368: "in higher maturity models")
#     does     what the level does at each stage, keyed by stage name. A
#              stage the level does not list is carried over from the level
#              below, and the page renders it as carried over.
#     guards   the parts of Figure 1 that guard each stage at this level,
#              keyed by stage name, as keys into `parts`. Only where the
#              paper ties that part to that stage at that level; a stage
#              with no part is left out. Level 3 builds on level 2 (line
#              433), so its lists keep level 2's parts. A stage the level
#              does not list in `does` carries its parts with its text.
#
#   parts    every part Figure 1 draws, by key. The figure and the rail
#            both take their names from here, so a name cannot differ
#            between them; a rail key with no part here fails the build.
#            Primitive names are the paper's (lines 278–339, "What it is
#            in practice") and must match software-factory/primitives.yaml,
#            ignoring case, or the build fails. The request that comes in and
#            the pull request that goes out are drawn as plain text, not
#            parts.
#
# Behind params.softwareFactory.showMaturity so the section can be pulled in
# one line if it moves.
parts:
  spec:         { name: Spec check, primitive: Supply Chain }        # 297, 415
  orchestrator: { name: Orchestrator, primitive: Orchestration }     # 336, 433
  scan:         { name: Registry scan, primitive: Supply Chain }     # 297, 423
  sandbox:      { name: Sandbox, primitive: Runtime Isolation }      # 323, 423
  profile:      { name: Signed profile }                  # 323, 419
  coding:       { name: Coding agent }                    # 423
  monitor:      { name: Monitoring agent }                # 445, 534
  plane:        { name: Agent control plane, primitive: Identity and Access }  # 284, 423
  identities:   { name: Identities }                      # 284
  credentials:  { name: Short-lived credentials }         # 284
  audit:        { name: Tamper-proof audit log }          # 284, 423
  tests:        { name: Tests, primitive: Supply Chain }  # 297, 423
  chaos:        { name: Chaos agent }                     # 441, 528
  egress:       { name: Egress proxy, primitive: Network }           # 310, 407, 423
  outside:      { name: "Models, registries, tools" }     # 218, 310
stages:
  - name: Inputs
  - name: Design
  - name: Assemble
    op: true
  - name: Build
    op: true
  - name: Verify
    op: true
levels:
  - name: Factory as a skill
    header: One local agent follows a workflow in a skill file.        # 397–403
    does:
      Inputs: >-  # 403
        A person reviews the prompt and any accompanying spec. Anyone with
        access to the skill can start the factory.
      Design: >-  # 403, 407
        An egress proxy blocks outbound traffic by default and permits only
        the connections the agent needs, such as source control,
        approved registries, and model gateways.
      Assemble: >-  # 411
        The factory waits through a package cool-down period before using
        new releases; this level does not scan packages.
      Build: >-  # 403, 411
        The agent runs the skill in a sandbox with restricted access to host
        files. It receives short-lived task credentials, and the audit log
        identifies both the agent and the person it acts for.
      Verify: >-  # 411
        The skill runs tests before opening a pull request for human review.
    guards:
      Design: [egress]              # 403, 407
      Build: [sandbox, plane]       # 403, 411
      Verify: [tests]               # 411
  - name: Factory as code
    header: A workflow defined in code runs several cloud agents in sequence.   # 393, 415
    repeat: true
    does:
      Inputs: >-  # 415
        The agent control plane enforces policy on who can start the factory.
        An AI judge or scanner checks the spec.
      Design: >-  # 415, 419
        The team approves registries, models, and resources ahead of time.
        Each agent receives a signed profile that defines its rules,
        network limits, and tools.
      Assemble: >-  # 423
        The factory scans skills and packages from registries for malware
        before agents use them.
      Build: >-  # 393, 415, 419, 423
        Cloud agents run in sequence under signed profiles; the runtime rejects
        unsigned profiles. The control plane supports credential revocation
        at any point and records each action in an audit log agents can’t alter.
      Verify: >-  # 423
        The factory tests agent output against the organization’s security
        and engineering standards.
    guards:
      Inputs: [plane, spec]         # 415
      Design: [egress, profile]     # 415, 419, 423
      Assemble: [scan]              # 423
      Build: [sandbox, egress, plane]   # 423
      Verify: [tests]               # 423
  - name: Factory as orchestrator
    header: A cloud orchestrator plans each run and coordinates the agents, retaining the controls from level 2.   # 393, 433–437
    repeat: true
    does:
      Inputs: >-  # 433
        Before starting a run, the orchestrator gathers the latest tickets,
        code changes, and conversations for a preflight check. It can ask
        a person for more input.
      Design: >-  # 433
        During preflight, the orchestrator selects the blueprints, models,
        and resources each agent can use.
      Build: >-  # 437, 445
        The orchestrator runs sub-agents in sequence or in parallel. A monitoring
        agent watches each coding agent and intervenes when it gets stuck.
      Verify: >-  # 441
        A chaos agent injects faulty code to test whether the checks catch it.
        The orchestrator collects records from each run to inform later runs.
    guards:
      Inputs: [plane, spec, orchestrator]       # 415, 433
      Design: [egress, profile, orchestrator]   # 419, 423, 433
      Build: [sandbox, egress, plane, monitor]  # 423, 445
      Verify: [tests, chaos]                    # 423, 441
