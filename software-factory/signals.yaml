# The paper's "Measuring the Factory" table (Draft 3, 5 October, lines
# 462–466), one entry per row, in the paper's order. /reference-architecture
# renders them as a numbered list under "Five signals to measure".
#
#   statement  the signal as one plain statement of what a secure factory
#              shows (the paper's "Measure…" column, said as a fact), with
#              the count it replaces (the "Instead of counting…" column)
#              folded into the same line as its contrast, so each item is
#              one sentence or two whole ones, never a fragment
signals:
  # d3 462
  - statement: >-
      Measure whether the code the factory produces reduces risk across the
      system, beyond the number of pull requests or lines of code.
  # d3 463, 451
  - statement: >-
      Track how quickly the factory detects and contains policy drift.
      Check whether it enforces the policy during a run.
  # d3 464
  - statement: >-
      Check whether the factory blocks tampered packages and hidden
      instructions before agents write code.
  # d3 465
  - statement: >-
      Check whether monitoring and policy enforcement cover every agent
      throughout its run.
  # d3 466
  - statement: >-
      Assess whether human review changes the factory’s decisions and
      output, beyond approving completed work.
