,154.34l53.17-53.17A4,4,0,0,1,170.83,101.17Z"/><text class="sfa-t" x="64" y="607" font-size="18">Tamper-evident record</text><text class="sfa-g" x="276" y="606" font-size="14.75">every boundary keeps its own, linked by run, out of any agent’s reach</text></g>
