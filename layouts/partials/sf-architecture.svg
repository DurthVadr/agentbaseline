<svg xmlns="http://www.w3.org/2000/svg" class="sfa-d" viewBox="0 0 880 631" role="img" aria-label="The agent proposes, the runtime authorization service decides, and the egress proxy enforces. Trusted context (who’s asking, who it acts for, the task, policy, any delegation and the profile’s bounds) flows into each decision. For each task and each delegation, the agent, untrusted and holding no credentials, proposes the scope it needs, which the service doesn’t take at face value; delegation only narrows a task, and only a new decision widens it. The proxy enforces this task’s scope and attaches the credentials. High-impact actions go to approval the agent can’t give; anything else is denied or sent to a person. The profile also configures each sandbox at launch. Every grant is recorded, and every boundary keeps a tamper-evident record. Badges number the boundaries: 1 identity and access, 2 supply chain (the admission point), 3 sandbox, 4 network.">
<defs><marker id="sfa-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sfa-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfa-w-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.7" markerHeight="5.7" orient="auto-start-reverse"><path class="sfa-mk sfa-mk-main" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-zone="sandbox"><rect class="sfa-zone sfa-b" x="264.5" y="14.5" width="241" height="149" rx="8" pathLength="1" data-k="3"/><text class="sfa-cap" x="278" y="37.5" font-size="14.75">SANDBOX</text><text class="sfa-g" x="365" y="37.5" font-size="14.75">one per task</text><text class="sfa-g" x="278" y="61" font-size="14.75">built from verified components</text></g>
<g data-card="Profile"><path class="sfa-doc" d="M20.5 74.5 H176.5 L189.5 87.5 V143.5 Q189.5 149.5 183.5 149.5 H20.5 Q14.5 149.5 14.5 143.5 V80.5 Q14.5 74.5 20.5 74.5 Z"/><path class="sfa-ear" d="M176.5 74.5 V87.5 H189.5 Z"/><text class="sfa-t" x="26" y="97.1" font-size="16">Profile</text><text class="sfa-g" x="26" y="116.1" font-size="14.75">for one kind of agent,</text><text class="sfa-g" x="26" y="135.1" font-size="14.75">the most it can ever do</text></g>
<g data-card="Agent"><rect class="sfa-box sfa-plate" x="278.5" y="74.5" width="213" height="75" rx="6"/><text class="sfa-t" x="290" y="97.1" font-size="16">Agent</text><text class="sfa-g" x="290" y="116.1" font-size="14.75">untrusted, and holds</text><text class="sfa-g" x="290" y="135.1" font-size="14.75">no credentials</text></g>
<g data-card="Egress proxy"><rect class="sfa-box sfa-b" x="540.5" y="65.5" width="113" height="93" rx="6" pathLength="1" data-k="4"/><text class="sfa-t" x="552" y="87.6" font-size="16">Egress proxy</text><text class="sfa-g" x="552" y="106.6" font-size="14.75">enforces it,</text><text class="sfa-g" x="552" y="125.6" font-size="14.75">attaches</text><text class="sfa-g" x="552" y="144.6" font-size="14.75">credentials</text></g>
<g data-card="Downstream"><rect class="sfa-box" x="686.5" y="75.5" width="185" height="73" rx="6"/><text class="sfa-t" x="698" y="97.1" font-size="16">Downstream</text><text class="sfa-g" x="698" y="116.1" font-size="14.75">only authorized</text><text class="sfa-g" x="698" y="135.1" font-size="14.75">operations reach it</text></g>
<g data-card="Admission point"><rect class="sfa-box sfa-b" x="686.5" y="161.5" width="185" height="91" rx="6" pathLength="1" data-k="2"/><text class="sfa-t" x="698" y="182.6" font-size="16">Admission point</text><text class="sfa-g" x="698" y="201.6" font-size="14.75">approved versions</text><text class="sfa-g" x="698" y="220.6" font-size="14.75">the profile allows;</text><text class="sfa-g" x="698" y="239.6" font-size="14.75">hides unsafe ones</text></g>
<g data-card="Everything else"><rect class="sfa-box sfa-deny" x="686.5" y="263.5" width="185" height="39" rx="6"/><text class="sfa-t" x="698" y="288.4" font-size="16">Everything else</text><text class="sfa-g" x="817" y="288.4" font-size="14.75">denied</text></g><path class="sfa-wire sfa-dash" d="M670 283 H678"/><path class="sfa-wire sfa-stop" d="M678 276 V290"/>
<g data-card="Trusted context"><rect class="sfa-box sfa-ctx" x="14.5" y="315.5" width="149" height="109" rx="6"/><text class="sfa-t" x="26" y="336.1" font-size="16">Trusted context</text><text class="sfa-g" x="26" y="355.1" font-size="14.75">who’s asking,</text><text class="sfa-g" x="26" y="374.1" font-size="14.75">who it acts for,</text><text class="sfa-g" x="26" y="393.1" font-size="14.75">the task, policy,</text><text class="sfa-g" x="26" y="412.1" font-size="14.75">and any delegation</text></g>
<g data-card="Runtime authorization service"><rect class="sfa-box sfa-b" x="254.5" y="313.5" width="399" height="113" rx="6" pathLength="1" data-k="1"/><text class="sfa-t" x="268" y="336.1" font-size="16">Runtime authorization service</text><text class="sfa-g" x="268" y="355.1" font-size="14.75">decides what access each task gets;</text><text class="sfa-g" x="268" y="374.1" font-size="14.75">delegation only narrows;</text><text class="sfa-g" x="268" y="393.1" font-size="14.75">only a new decision widens a task;</text><text class="sfa-g" x="268" y="412.1" font-size="14.75">anything else: denied, or sent to a person</text></g>
<g data-card="Approval"><rect class="sfa-box" x="468.5" y="465.5" width="185" height="91" rx="6"/><text class="sfa-t" x="480" y="486.6" font-size="16">Approval</text><text class="sfa-g" x="480" y="505.6" font-size="14.75">the agent can’t give it:</text><text class="sfa-g" x="480" y="524.6" font-size="14.75">a person, or automatic</text><text class="sfa-g" x="480" y="543.6" font-size="14.75">within approval policy</text><path class="sfa-ico" transform="translate(554 475) scale(0.0703125)" d="M188,92a23.9,23.9,0,0,0-16,6.13V60a24,24,0,0,0-40.07-17.8A24,24,0,0,0,84,44V58.13A24,24,0,0,0,44,76v76a84,84,0,0,0,168,0V116A24,24,0,0,0,188,92Zm16,60a76,76,0,0,1-152,0V76a16,16,0,0,1,32,0v44a4,4,0,0,0,8,0V44a16,16,0,0,1,32,0v68a4,4,0,0,0,8,0V60a16,16,0,0,1,32,0v72.18A44.06,44.06,0,0,0,124,176a4,4,0,0,0,8,0,36,36,0,0,1,36-36,4,4,0,0,0,4-4V116a16,16,0,0,1,32,0Z"/></g>
