<svg xmlns="http://www.w3.org/2000/svg" class="sfa-d" viewBox="0 0 880 536" role="img" aria-label="The agent proposes, the runtime authorization service decides, and the egress proxy enforces. The agent runs in a sandbox, untrusted and holding no credentials, and proposes the scope it needs; the service authorizes each task’s scope within the bounds of the profile, using trusted context (identity, the task, any delegation and policy), and the proxy enforces it and attaches the credentials. Delegation only narrows a task, and only a new decision widens it. High-impact actions go to approval the agent can’t give; anything else is denied or sent to a person. The profile configures the sandbox at launch through supply chain scanning, which checks the components it is built from, and the proxy checks every package it fetches with it, so only approved versions the profile allows get in and new versions wait out a cooldown. Every grant, admission, process start and request goes into a tamper-evident record, linked by run. Badges number the boundaries as the paper does: 1 sandbox, 2 network, 3 supply chain, 4 identity and access; the proxy also carries 4, as a ring where the authorized scope comes in, because it enforces the service’s decisions.">
<defs><marker id="sfa-w-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sfa-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfa-w-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.7" markerHeight="5.7" orient="auto-start-reverse"><path class="sfa-mk sfa-mk-main" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-zone="sandbox"><rect class="sfa-zone sfa-b" x="214.5" y="112.5" width="235" height="129" rx="8" pathLength="1" data-k="1"/><text class="sfa-cap" x="228" y="135.5" font-size="14.75">SANDBOX</text></g>
<g data-card="Supply chain scanning"><rect class="sfa-box sfa-b" x="300.5" y="14.5" width="359" height="61" rx="6" pathLength="1" data-k="3"/><text class="sfa-t" x="312" y="39.6" font-size="16">Supply chain scanning</text><text class="sfa-g" x="312" y="58.6" font-size="14.75">approved versions the profile allows</text></g>
<g data-card="Profile"><path class="sfa-doc" d="M20.5 14.5 H184.5 L197.5 27.5 V69.5 Q197.5 75.5 191.5 75.5 H20.5 Q14.5 75.5 14.5 69.5 V20.5 Q14.5 14.5 20.5 14.5 Z"/><path class="sfa-ear" d="M184.5 14.5 V27.5 H197.5 Z"/><text class="sfa-t" x="26" y="39.6" font-size="16">Profile</text><text class="sfa-g" x="26" y="58.6" font-size="14.75">the most it can ever do</text></g>
<g data-card="Agent"><rect class="sfa-box sfa-plate" x="228.5" y="156.5" width="207" height="61" rx="6"/><text class="sfa-t" x="240" y="181.6" font-size="16">Agent</text><text class="sfa-g" x="240" y="200.6" font-size="14.75">untrusted, no credentials</text></g>
<g data-card="Egress proxy"><rect class="sfa-box sfa-b" x="484.5" y="147.5" width="175" height="79" rx="6" pathLength="1" data-k="2"/><text class="sfa-t" x="496" y="172.1" font-size="16">Egress proxy</text><text class="sfa-g" x="496" y="191.1" font-size="14.75">default-deny,</text><text class="sfa-g" x="496" y="210.1" font-size="14.75">attaches credentials</text></g>
<g data-card="Downstream"><rect class="sfa-box" x="686.5" y="147.5" width="185" height="79" rx="6"/><text class="sfa-t" x="698" y="172.1" font-size="16">Downstream</text><text class="sfa-g" x="698" y="191.1" font-size="14.75">only authorized</text><text class="sfa-g" x="698" y="210.1" font-size="14.75">operations</text></g>
<g data-card="Everything else"><rect class="sfa-box sfa-deny" x="686.5" y="239.5" width="185" height="39" rx="6"/><text class="sfa-t" x="698" y="264.4" font-size="16">Everything else</text><text class="sfa-g" x="817" y="264.4" font-size="14.75">denied</text></g><path class="sfa-wire sfa-dash" d="M672 259 H678"/><path class="sfa-wire sfa-stop" d="M678 252 V266"/>
<g data-card="Trusted context"><rect class="sfa-box sfa-ctx" x="14.5" y="291.5" width="149" height="79" rx="6"/><text class="sfa-t" x="26" y="316.1" font-size="16">Trusted context</text><text class="sfa-g" x="26" y="335.1" font-size="14.75">identity, task,</text><text class="sfa-g" x="26" y="354.1" font-size="14.75">delegation, policy</text></g>
<g data-card="Runtime authorization service"><rect class="sfa-box sfa-b" x="214.5" y="300.5" width="445" height="61" rx="6" pathLength="1" data-k="4"/><text class="sfa-t" x="228" y="325.6" font-size="16">Runtime authorization service</text><text class="sfa-g" x="228" y="344.6" font-size="14.75">authorizes each task’s scope</text></g>
