<svg xmlns="http://www.w3.org/2000/svg" class="sfa-d" viewBox="0 0 348 936" role="img" aria-label="The agent proposes, the runtime authorization service decides, and the egress proxy enforces. Trusted context (who’s asking, who it acts for, the task, policy, any delegation and the profile’s bounds) flows into each decision. For each task and each delegation, the agent, untrusted and holding no credentials, proposes the scope it needs, which the service doesn’t take at face value; delegation only narrows a task, and only a new decision widens it. The proxy enforces this task’s scope and attaches the credentials. High-impact actions go to approval the agent can’t give; anything else is denied or sent to a person. The profile also configures each sandbox at launch. Every grant is recorded, and every boundary keeps a tamper-evident record. Badges number the boundaries: 1 identity and access, 2 supply chain (the admission point), 3 sandbox, 4 network.">
<defs><marker id="sfa-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfa-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfa-n-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.3" markerHeight="5.3" orient="auto-start-reverse"><path class="sfa-mk sfa-mk-main" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-zone="sandbox"><rect class="sfa-zone sfa-b" x="56.5" y="96.5" width="255" height="111" rx="8" pathLength="1" data-k="3"/><text class="sfa-cap" x="70" y="117.4" font-size="11.75">SANDBOX</text><text class="sfa-g" x="144" y="117.4" font-size="11.75">one per task</text><text class="sfa-g" x="70" y="135" font-size="11.75">built from verified components</text></g>
<g data-card="Profile"><path class="sfa-doc" d="M22.5 12.5 H298.5 L311.5 25.5 V53.5 Q311.5 59.5 305.5 59.5 H22.5 Q16.5 59.5 16.5 53.5 V18.5 Q16.5 12.5 22.5 12.5 Z"/><path class="sfa-ear" d="M298.5 12.5 V25.5 H311.5 Z"/><text class="sfa-t" x="28" y="31.4" font-size="13">Profile</text><text class="sfa-g" x="28" y="47.4" font-size="11.75">for one kind of agent, the most it can ever do</text></g>
<g data-card="Agent"><rect class="sfa-box sfa-plate" x="70.5" y="148.5" width="227" height="45" rx="6"/><text class="sfa-t" x="82" y="166.4" font-size="13">Agent</text><text class="sfa-g" x="82" y="182.4" font-size="11.75">untrusted, and holds no credentials</text></g>
<g data-card="Trusted context"><rect class="sfa-box sfa-ctx" x="48.5" y="234.5" width="135" height="91" rx="6"/><text class="sfa-t" x="60" y="251.4" font-size="13">Trusted context</text><text class="sfa-g" x="60" y="267.4" font-size="11.75">who’s asking,</text><text class="sfa-g" x="60" y="283.4" font-size="11.75">who it acts for,</text><text class="sfa-g" x="60" y="299.4" font-size="11.75">the task, policy,</text><text class="sfa-g" x="60" y="315.4" font-size="11.75">and any delegation</text></g>
<g data-card="Runtime authorization service"><rect class="sfa-box sfa-b" x="16.5" y="352.5" width="295" height="109" rx="6" pathLength="1" data-k="1"/><text class="sfa-t" x="30" y="370.4" font-size="13">Runtime authorization service</text><text class="sfa-g" x="30" y="386.4" font-size="11.75">decides what access each task gets</text><text class="sfa-g" x="30" y="402.4" font-size="11.75">and records every grant;</text><text class="sfa-g" x="30" y="418.4" font-size="11.75">delegation only narrows;</text><text class="sfa-g" x="30" y="434.4" font-size="11.75">only a new decision widens a task;</text><text class="sfa-g" x="30" y="450.4" font-size="11.75">anything else: denied, or sent to a person</text></g>
<g data-card="Approval"><rect class="sfa-box" x="152.5" y="488.5" width="159" height="77" rx="6"/><text class="sfa-t" x="164" y="507.9" font-size="13">Approval</text><text class="sfa-g" x="164" y="522.9" font-size="11.75">the agent can’t give it:</text><text class="sfa-g" x="164" y="537.9" font-size="11.75">a person, or automatic</text><text class="sfa-g" x="164" y="552.9" font-size="11.75">within approval policy</text><path class="sfa-ico" transform="translate(230 497) scale(0.05859375)" d="M188,92a23.9,23.9,0,0,0-16,6.13V60a24,24,0,0,0-40.07-17.8A24,24,0,0,0,84,44V58.13A24,24,0,0,0,44,76v76a84,84,0,0,0,168,0V116A24,24,0,0,0,188,92Zm16,60a76,76,0,0,1-152,0V76a16,16,0,0,1,32,0v44a4,4,0,0,0,8,0V44a16,16,0,0,1,32,0v68a4,4,0,0,0,8,0V60a16,16,0,0,1,32,0v72.18A44.06,44.06,0,0,0,124,176a4,4,0,0,0,8,0,36,36,0,0,1,36-36,4,4,0,0,0,4-4V116a16,16,0,0,1,32,0Z"/></g>
<g data-card="Egress proxy"><rect class="sfa-box sfa-b" x="56.5" y="606.5" width="255" height="45" rx="6" pathLength="1" data-k="4"/><text class="sfa-t" x="68" y="624.4" font-size="13">Egress proxy</text><text class="sfa-g" x="68" y="640.4" font-size="11.75">enforces it, attaches credentials</text></g>
<g data-card="Downstream"><rect class="sfa-box" x="56.5" y="670.5" width="255" height="45" rx="6"/><text class="sfa-t" x="68" y="688.4" font-size="13">Downstream</text><text class="sfa-g" x="68" y="704.4" font-size="11.75">only authorized operations reach it</text></g>
<g data-card="Admission point"><rect class="sfa-box sfa-b" x="56.5" y="728.5" width="255" height="61" rx="6" pathLength="1" data-k="2"/><text class="sfa-t" x="68" y="746.4" font-size="13">Admission point</text><text class="sfa-g" x="68" y="762.4" font-size="11.75">approved versions the profile allows;</text><text class="sfa-g" x="68" y="778.4" font-size="11.75">hides unsafe ones</text></g>
<g data-card="Everything else"><rect class="sfa-box sfa-deny" x="56.5" y="802.5" width="255" height="39" rx="6"/><text class="sfa-t" x="68" y="817.4" font-size="13">Everything else</text><text class="sfa-g" x="68" y="833.4" font-size="11.75">denied</text></g><path class="sfa-wire sfa-dash" d="M34 822 H48"/><path class="sfa-wire sfa-stop" d="M48 815 V829"/>
<g data-card="Tamper-evident record"><rect class="sfa-rec" x="16.5" y="860.5" width="315" height="71" rx="6"/><path class="sfa-ico sfa-ico-rec" transform="translate(28 872) scale(0.09375)" d="M223,105.58c-4-4.2-8.2-8.54-10-12.8-1.65-4-1.73-9.53-1.82-15.41-.14-9-.29-19.19-6.83-25.74s-16.74-6.69-25.74-6.83c-5.88-.09-11.43-.17-15.41-1.82-4.26-1.76-8.6-5.93-12.8-9.95-6.68-6.41-13.59-13-22.42-13s-15.74,6.62-22.42,13c-4.2,4-8.54,8.2-12.8,10-4,1.65-9.53,1.73-15.41,1.82-9,.14-19.19.29-25.74,6.83S44.94,68.37,44.8,77.37c-.09,5.88-.17,11.43-1.82,15.41-1.76,4.26-5.93,8.6-9.95,12.8-6.41,6.68-13,13.59-13,22.42s6.62,15.74,13,22.42c4,4.2,8.2,8.54,10,12.8,1.65,4,1.73,9.53,1.82,15.41.14,9,.29,19.19,6.83,25.74s16.74,6.69,25.74,6.83c5.88.09,11.43.17,15.41,1.82,4.26,1.76,8.6,5.93,12.8,9.95,6.68,6.41,13.59,13,22.42,13s15.74-6.62,22.42-13c4.2-4,8.54-8.2,12.8-10,4-1.65,9.53-1.73,15.41-1.82,9-.14,19.19-.29,25.74-6.83s6.69-16.74,6.83-25.74c.09-5.88.17-11.43,1.82-15.41,1.76-4.26,5.93-8.6,9.95-12.8,6.41-6.68,13-13.59,13-22.42S229.38,112.26,223,105.58Zm-5.78,39.3c-4.54,4.73-9.24,9.63-11.57,15.28-2.23,5.39-2.33,12-2.43,18.35-.12,8.2-.24,16-4.49,20.2s-12,4.37-20.2,4.49c-6.37.1-13,.2-18.35,2.43-5.65,2.33-10.55,7-15.28,11.57C139.09,222.75,133.62,228,128,228s-11.09-5.25-16.88-10.8c-4.73-4.54-9.63-9.24-15.28-11.57-5.39-2.23-12-2.33-18.35-2.43-8.2-.12-15.95-.24-20.2-4.49s-4.37-12-4.49-20.2c-.1-6.37-.2-13-2.43-18.35-2.33-5.65-7-10.55-11.57-15.28C33.25,139.09,28,133.62,28,128s5.25-11.09,10.8-16.88c4.54-4.73,9.24-9.63,11.57-15.28,2.23-5.39,2.33-12,2.43-18.35.12-8.2.24-15.95,4.49-20.2s12-4.37,20.2-4.49c6.37-.1,13-.2,18.35-2.43,5.65-2.33,10.55-7,15.28-11.57C116.91,33.25,122.38,28,128,28s11.09,5.25,16.88,10.8c4.73,4.54,9.63,9.24,15.28,11.57,5.39,2.23,12,2.33,18.35,2.43,8.2.12,16,.24,20.2,4.49s4.37,12,4.49,20.2c.1,6.37.2,13,2.43,18.35,2.33,5.65,7,10.55,11.57,15.28,5.55,5.79,10.8,11.26,10.8,16.88S222.75,139.09,217.2,144.88Zm-46.37-43.71a4,4,0,0,1,0,5.66l-56,56a4,4,0,0,1-5.66,0l-24-24a4,4,0,0,1,5.66-5.66L112,154.34l53.17-53.17A4,4,0,0,1,170.83,101.17Z"/><text class="sfa-t" x="60" y="890" font-size="15">Tamper-evident record</text><text class="sfa-g" x="28" y="910" font-size="11.75">every boundary keeps its own, linked by run,</text><text class="sfa-g" x="28" y="925" font-size="11.75">out of any agent’s reach</text></g>
