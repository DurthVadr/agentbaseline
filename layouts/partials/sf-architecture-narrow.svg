<svg xmlns="http://www.w3.org/2000/svg" class="sfa-d" viewBox="0 0 348 712" role="img" aria-label="The agent proposes, the runtime authorization service decides, and the egress proxy enforces. The agent runs in a sandbox, untrusted and holding no credentials, and proposes the scope it needs; the service authorizes each task’s scope within the bounds of the profile, using trusted context (identity, the task, any delegation and policy), and the proxy enforces it and attaches the credentials. Delegation only narrows a task, and only a new decision widens it. High-impact actions go to approval the agent can’t give; anything else is denied or sent to a person. The profile configures the sandbox at launch through supply chain scanning, which checks the components it is built from, and the proxy checks every package it fetches with it, so only approved versions the profile allows get in and new versions wait out a cooldown. Every grant, admission, process start and request goes into a tamper-evident record, linked by run. Badges number the boundaries as the paper does: 1 sandbox, 2 network, 3 supply chain, 4 identity and access; the proxy also carries 4, as a ring where the authorized scope comes in, because it enforces the service’s decisions.">
<defs><marker id="sfa-n-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="sfa-mk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="sfa-n-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.3" markerHeight="5.3" orient="auto-start-reverse"><path class="sfa-mk sfa-mk-main" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g data-zone="sandbox"><rect class="sfa-zone sfa-b" x="44.5" y="180.5" width="135" height="115" rx="8" pathLength="1" data-k="1"/><text class="sfa-cap" x="58" y="201.4" font-size="11.75">SANDBOX</text></g>
<g data-card="Profile"><path class="sfa-doc" d="M22.5 12.5 H318.5 L331.5 25.5 V55.5 Q331.5 61.5 325.5 61.5 H22.5 Q16.5 61.5 16.5 55.5 V18.5 Q16.5 12.5 22.5 12.5 Z"/><path class="sfa-ear" d="M318.5 12.5 V25.5 H331.5 Z"/><text class="sfa-t" x="28" y="32.4" font-size="13">Profile</text><text class="sfa-g" x="28" y="48.4" font-size="11.75">the most it can ever do</text></g>
<g data-card="Supply chain scanning"><rect class="sfa-box sfa-b" x="44.5" y="96.5" width="287" height="49" rx="6" pathLength="1" data-k="3"/><text class="sfa-t" x="56" y="116.4" font-size="13">Supply chain scanning</text><text class="sfa-g" x="56" y="132.4" font-size="11.75">approved versions the profile allows</text></g>
<g data-card="Agent"><rect class="sfa-box sfa-plate" x="56.5" y="216.5" width="111" height="65" rx="6"/><text class="sfa-t" x="68" y="236.4" font-size="13">Agent</text><text class="sfa-g" x="68" y="252.4" font-size="11.75">untrusted,</text><text class="sfa-g" x="68" y="268.4" font-size="11.75">no credentials</text></g>
<g data-card="Egress proxy"><rect class="sfa-box sfa-b" x="192.5" y="216.5" width="139" height="65" rx="6" pathLength="1" data-k="2"/><text class="sfa-t" x="204" y="236.4" font-size="13">Egress proxy</text><text class="sfa-g" x="204" y="252.4" font-size="11.75">default-deny,</text><text class="sfa-g" x="204" y="268.4" font-size="11.75">attaches credentials</text></g>
<g data-card="Runtime authorization service"><rect class="sfa-box sfa-b" x="16.5" y="330.5" width="315" height="49" rx="6" pathLength="1" data-k="4"/><text class="sfa-t" x="30" y="350.4" font-size="13">Runtime authorization service</text><text class="sfa-g" x="30" y="366.4" font-size="11.75">authorizes each task’s scope</text></g>
<g data-card="Trusted context"><rect class="sfa-box sfa-ctx" x="16.5" y="410.5" width="143" height="65" rx="6"/><text class="sfa-t" x="28" y="430.4" font-size="13">Trusted context</text><text class="sfa-g" x="28" y="446.4" font-size="11.75">identity, task,</text><text class="sfa-g" x="28" y="462.4" font-size="11.75">delegation, policy</text></g>
<g data-card="Approval"><rect class="sfa-box" x="176.5" y="410.5" width="141" height="49" rx="6"/><text class="sfa-t" x="188" y="430.4" font-size="13">Approval</text><text class="sfa-g" x="188" y="446.4" font-size="11.75">automatic or a person</text><path class="sfa-ico" transform="translate(252 419) scale(0.05859375)" d="M188,92a23.9,23.9,0,0,0-16,6.13V60a24,24,0,0,0-40.07-17.8A24,24,0,0,0,84,44V58.13A24,24,0,0,0,44,76v76a84,84,0,0,0,168,0V116A24,24,0,0,0,188,92Zm16,60a76,76,0,0,1-152,0V76a16,16,0,0,1,32,0v44a4,4,0,0,0,8,0V44a16,16,0,0,1,32,0v68a4,4,0,0,0,8,0V60a16,16,0,0,1,32,0v72.18A44.06,44.06,0,0,0,124,176a4,4,0,0,0,8,0,36,36,0,0,1,36-36,4,4,0,0,0,4-4V116a16,16,0,0,1,32,0Z"/></g>
<g data-card="Downstream"><rect class="sfa-box" x="56.5" y="500.5" width="261" height="49" rx="6"/><text class="sfa-t" x="68" y="520.4" font-size="13">Downstream</text><text class="sfa-g" x="68" y="536.4" font-size="11.75">only authorized operations</text></g>
<g data-card="Everything else"><rect class="sfa-box sfa-deny" x="56.5" y="562.5" width="261" height="39" rx="6"/><text class="sfa-t" x="68" y="586.4" font-size="13">Everything else</text><text class="sfa-g" x="172" y="586.4" font-size="11.75">denied</text></g><path class="sfa-wire sfa-dash" d="M340 582 H326"/><path class="sfa-wire sfa-stop" d="M326 575 V589"/>
