<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" aria-labelledby="sf5-t sf5-d">
  <title id="sf5-t">Level 3: an agent orchestrates but can't grant itself access</title>
  <desc id="sf5-d">Signals and requests reach an orchestrator agent, which proposes a profile and task scope for each piece of work to the runtime authorization service. The execution layer starts each agent in its own sandbox, with its own profile, and only with the access the service granted. A monitoring agent watches from outside the sandboxes. The boundaries are the same as at Levels 1 and 2. Approval is by a person or automatic; deploys reach production, which sends back signals.</desc>
