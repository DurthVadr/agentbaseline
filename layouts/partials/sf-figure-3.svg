  <path d="M436 200 L460 200" fill="none" stroke="var(--fig-faint,var(--faint))" stroke-width="1.1" marker-end="url(#sf3-a)"/>
  <rect x="600.5" y="124.5" width="119" height="43" rx="4" fill="none" stroke="var(--fig-rule,var(--baseline))" stroke-width="1"/>
