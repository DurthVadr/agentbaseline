  <text x="610" y="161.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">the repository</text>
  <rect x="600.5" y="176.5" width="119" height="43" rx="4" fill="none" stroke="var(--fig-rule,var(--baseline))" stroke-width="1"/>
  <text x="610" y="197" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="var(--fig-ink,var(--ink))" font-weight="600">Services</text>
  <text x="610" y="213.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">the task needs</text>
  <rect x="600.5" y="228.5" width="119" height="43" rx="4" fill="none" stroke="var(--fig-accent,var(--accent))" stroke-width="1.25"/>
  <text x="610" y="249" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="var(--fig-ink,var(--ink))" font-weight="600">Model gateway</text>
  <text x="610" y="265.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">approved models</text>
  <rect x="600.5" y="280.5" width="119" height="57" rx="4" fill="none" stroke="var(--fig-accent,var(--accent))" stroke-width="1.25"/>
  <circle cx="600" cy="280" r="8" fill="var(--fig-accent,var(--accent))"/>
