<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 568" role="img" aria-labelledby="sf3-t sf3-d">
  <title id="sf3-t">Level 1: a developer gives an agent room to work</title>
  <desc id="sf3-d">The developer directs one coding agent, which runs in a sandbox on the developer's machine or a remote environment and loops until its work passes. All of its traffic leaves through a default-deny egress proxy that enforces the runtime authorization service's decision and attaches credentials, so it reaches source control, the services the task needs, a model gateway and an admission point for packages, and nothing else. Its pull request goes back to the developer for review.</desc>
