  <circle cx="264" cy="124" r="8" fill="var(--fig-accent,var(--accent))"/>
  <text x="260.7" y="127.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.25" fill="var(--fig-plate,var(--paper))" font-weight="600">3</text>
  <text x="278" y="148" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="500" letter-spacing="0.06em">SANDBOX</text>
