  <text x="451.3333333333333" y="146" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">until it passes</text>
  <text x="300.0" y="186" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">Assembled from agents and harnesses, models, skills,</text>
  <text x="300.0" y="200.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">tools and MCP servers, dependencies and blueprints</text>
