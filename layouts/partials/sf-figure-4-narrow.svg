<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 1046" role="img" aria-label="A request, event, schedule or ticket starts a workflow on CI/CD or a durable execution engine, which runs a coding agent in a fresh sandbox, behind its own proxy, for each run; the pull request goes through approval to merge, and review feedback starts the next run. The authorization service, proxy and destinations are the same as at Level 1.">
