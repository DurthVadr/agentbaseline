<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 532" role="img" aria-labelledby="sf6-t sf6-d">
  <title id="sf6-t">Only a new authorization decision can widen a task</title>
  <desc id="sf6-d">A production alert reports elevated errors in the payments service. The orchestrator agent proposes a task and an incident profile; the runtime authorization service grants the task the payments service's logs for the last hour and one pull request, and the egress proxy enforces that grant. When the incident agent reaches for the authentication service's logs, the proxy blocks the call; only a new authorization decision could widen the task. The fix uses a library admitted through the supply chain and leaves as a pull request that approval policy routes; the deploy reaches a small share of traffic first, and the error rate afterwards confirms the fix or starts the next run.</desc>
