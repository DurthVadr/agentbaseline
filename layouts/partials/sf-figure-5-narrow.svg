<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 1246" role="img" aria-labelledby="sf5n-t sf5n-d">
  <title id="sf5n-t">Level 3, where an agent orchestrates but can't grant itself access</title>
  <desc id="sf5n-d">An orchestrator agent turns signals and requests into tasks and proposes each one's profile and scope to the authorization service, which alone grants access; the execution layer starts each agent in its own sandbox, and a monitoring agent watches from outside and flags new work. Changes go through approval and deploy to production, whose signals start the next work, inside the same boundaries as Levels 1 and 2.</desc>
