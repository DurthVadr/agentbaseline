  <text x="278" y="156" font-family="'Chakra Petch','Avenir Next',sans-serif" font-size="11" fill="var(--fig-soft,var(--soft))" font-weight="500" letter-spacing="0.06em">SANDBOX</text>
  <text x="278" y="184" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="var(--fig-ink,var(--ink))" font-weight="600">Agent</text>
  <text x="278" y="200" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">holds no credentials</text>
  <path d="M396 132 L396 74" fill="none" stroke="var(--fig-faint,var(--faint))" stroke-width="1.1" marker-end="url(#sf2-a)"/>
  <text x="297.4375" y="100" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">proposes scope</text>
  <rect x="460.5" y="166.5" width="99" height="83" rx="4" fill="none" stroke="var(--fig-accent,var(--accent))" stroke-width="1.25"/>
  <circle cx="460" cy="166" r="8" fill="var(--fig-accent,var(--accent))"/>
  <text x="456.7" y="169.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="var(--fig-plate,var(--paper))" font-weight="600">4</text>
  <text x="470" y="187" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="var(--fig-ink,var(--ink))" font-weight="600">Egress proxy</text>
  <text x="470" y="203.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">enforces it,</text>
  <text x="470" y="217.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">attaches</text>
  <text x="470" y="232.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">credentials</text>
  <path d="M436 208 L460 208" fill="none" stroke="var(--fig-faint,var(--faint))" stroke-width="1.1" marker-end="url(#sf2-a)"/>
  <rect x="600.5" y="166.5" width="119" height="83" rx="4" fill="none" stroke="var(--fig-rule,var(--baseline))" stroke-width="1"/>
  <text x="610" y="187" font-family="Figtree,'Avenir Next','Helvetica Neue',sans-serif" font-size="12.5" fill="var(--fig-ink,var(--ink))" font-weight="600">Downstream</text>
  <text x="610" y="203.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">only authorized</text>
  <text x="610" y="217.5" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">operations</text>
  <text x="610" y="232.0" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-soft,var(--soft))" font-weight="400">reach it</text>
  <path d="M560 208 L600 208" fill="none" stroke="var(--fig-faint,var(--faint))" stroke-width="1.1" marker-end="url(#sf2-a)"/>
  <line x1="0" y1="306" x2="720" y2="306" stroke="url(#fadeE4E5E10x720)" stroke-width="1"/>
  <rect x="0.5" y="313.5" width="27" height="15" rx="4" fill="none" stroke="var(--fig-accent,var(--accent))" stroke-width="1.25"/>
  <text x="40" y="325" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-ink,var(--ink))" font-weight="400">Enforced outside the agent's loop, numbered by the boundary it holds</text>
  <circle cx="48" cy="347" r="8" fill="var(--fig-accent,var(--accent))"/>
  <text x="44.7" y="350.9" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="var(--fig-plate,var(--paper))" font-weight="600">1</text>
