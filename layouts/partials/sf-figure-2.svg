  <text x="292" y="383" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-ink,var(--ink))" font-weight="400">Request or traffic</text>
  <path d="M452 379 L488 379" fill="none" stroke="var(--fig-accent,var(--accent))" stroke-width="1.25" stroke-dasharray="5 3" marker-end="url(#sf2-g)"/>
  <text x="498" y="383" font-family="'IBM Plex Serif',Charter,Georgia,serif" font-size="11.25" fill="var(--fig-ink,var(--ink))" font-weight="400">Authorization decision</text>
