baseURL = "https://agentbaseline.org/"
title = "Agent Baseline"
locale = "en"

# This site is two pages and a PDF. It has no taxonomies, no sections and no
# feed, so the kinds that would invent them are switched off.
#
# Placement is load-bearing, not style. TOML has no closing delimiter: every
# key after a [table] header belongs to that table until the next header. This
# line used to sit below the [[module.mounts]] block, which made it a key of
# the last mount rather than a root setting — Hugo dropped it silently and
# published all six kinds anyway. That is how /categories and /tags came to
# serve empty RSS channels to browsers as `application/xml`. Root keys go
# above the first table header.
#
# `sitemap` and `404` are deliberately absent: the site ships its own templates
# for both (layouts/sitemap.xml, layouts/404.html), and disabling either kind
# would suppress the file Hugo needs to write.
disableKinds = ["taxonomy", "term", "RSS", "section"]

# The site renders FROM the catalogue: whitepaper/controls.yaml is mounted
# into Hugo's data tree, so the outcomes and their identifier ranges on the
# page are generated from it and cannot drift.
[[module.mounts]]
  source = "whitepaper/controls.yaml"
  target = "data/controls.yaml"
[[module.mounts]]
  source = "whitepaper/contributors.yaml"
  target = "data/contributors.yaml"
[[module.mounts]]
  source = "software-factory/boundaries.yaml"
  target = "data/sfboundaries.yaml"
[[module.mounts]]
  source = "software-factory/levels.yaml"
  target = "data/sflevels.yaml"
[[module.mounts]]
  source = "software-factory/contributors.yaml"
  target = "data/sfcontributors.yaml"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "content"
  target = "content"

[params]
  version       = "1.0-draft"
  published     = "30 July 2026"
  commentsUntil = "30 September 2026"
  repo          = "https://github.com/agentbaseline/agentbaseline"

  # The community Slack, linked from the utility bar and the review section.
  # A shared invite link. Slack's default is a link that lives 30 days and
  # 400 uses; the expiry is chosen when the link is copied (Invite people →
  # Copy invite link → Edit link settings), and an owner or admin renews a
  # lapsed one under Workspace settings → People → Invitations → Invite links.
  # The site would go on pointing at a dead link, so this is the one line to
  # change. Check it in a browser: join.slack.com answers curl with 302 then
  # 403 whether or not the link is live. Leave it empty and the links go.
  # A root key of [params], so it stays above the first sub-table.
  slack         = "https://join.slack.com/t/agentbaseline/shared_invite/zt-4af54ql1d-flDoRP_Bk~l1XxcU4sWJRg"

  # Every brand download is served under this prefix, so a file that has left
  # the site still says whose mark it is. The prefix is in the served name, not
  # only in the <a download> attribute, because Vercel sends every static file
  # with Content-Disposition: inline; filename="<served name>", and for a
  # same-origin download that filename takes precedence over the attribute
  # (HTML, "downloading resources", step 6): Chrome saved icon.svg, not
  # agent-baseline-icon.svg. A root key of [params], so it has to stay above
  # the first sub-table — see the note at the top of this file.
  brandPrefix = "agent-baseline"

# The downloadable brand assets, in the order both menus list them. Two surfaces
# offer these — the Artifacts dropdown and the wordmark's own right-click menu —
# and both read this one list through partials/brand-rows.html, so an asset is
# added here and nowhere else.
#
#   path  what the site serves, and therefore what a download saves as. The
#         row's label is the path with brandPrefix trimmed. The favicon stays
#         at icon.svg and icon-512.png for the nine <link> tags that name it;
#         bin/build-brand writes the branded copies beside them from the same
#         bytes, so nothing is kept by hand twice.
#   icon  a partial under layouts/partials/icons.
#
# Each file is for one ground: the plain wordmark is dark ink for light grounds,
# the -on-dark files carry the dark theme's ink for dark grounds, and the
# animated wordmark exists only for dark grounds. The name says which.
#
# Each path is checked with fileExists at build time, so an asset that has not
# been generated yet costs a missing row rather than a 404.
[[params.brandAssets]]
  path = "agent-baseline-wordmark.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-wordmark.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-on-dark.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-on-dark.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-icon.svg"
  icon = "file-svg"
[[params.brandAssets]]
  path = "agent-baseline-icon.png"
  icon = "file-png"
[[params.brandAssets]]
  path = "agent-baseline-wordmark-animated-on-dark.mov"
  icon = "file-video"

# The reference architecture: the second paper, built on the baseline, with
# the software factory as its subject. The homepage section, its own page, the
# Artifacts rows, the bar's link and the controls page all read this table.
# `pdf` and `paper` are checked with fileExists, so a checkout without the
# file gets no dead link; `source` is the repo subfolder; `template` is the
# issue form that applies the `software-factory` label, which an outside
# commenter cannot set from a URL. `commentsUntil` is empty until the working
# group names a date — the copy then says "open for comment" and no more.
# The PDF is published and required (bin/papers.py): a missing PDF or manifest
# fails bin/check-sf-pdf, and so does one that isn't the build of this source.
[params.softwareFactory]
  # The homepage's one line about the second paper, in its section after the
  # baseline's own paper. The paper's page writes its own opening. Keep it
  # shorter than the white paper's line above it (19 words) and on one line
  # at the 680px measure, so the section stays smaller than the baseline's.
  summary       = "The Secure Software Factory applies Agent Baseline to agents that ship code."
  # The paper's own front matter (software-factory.md, line 3: "Version 1,
  # October 13, 2026"). The page's title block states them; check-copy holds
  # them to the paper.
  version       = "1"
  published     = "13 October 2026"
  pdf           = "software-factory.pdf"
  source        = "software-factory"
  # The paper's markdown inside `source`; checked with fileExists like `pdf`.
  paper         = "software-factory.md"
  template      = "software-factory.yml"
  commentsUntil = ""
  # The bar link's New tag, and the New on the homepage's launch line, render
  # only before this moment, two weeks after the 13 October launch; the link
  # and the line stay (layouts/partials/sf-new.html). Compared at build time,
  # like [params.event].until, and with the New York offset for the same
  # reason (a bare date is midnight UTC, 8 pm the evening before in New York).
  # The site does not rebuild on its own: redeploy on or after 27 October or
  # the tag stays up.
  launchUntil   = "2026-10-27T00:00:00-04:00"
  # The levels band: the paper's level names, figures and captions, with one
  # sentence per level written for the page (software-factory/levels.yaml).
  # Set false and the band leaves in one line.
  showLevels    = true

# Thanked on the homepage, under the bylines, for supporting and adopting the
# framework. Organizations, not authors: the bylines are people. One line each:
# the name, which is what a screen reader hears for the mark; the mark, a
# partial under layouts/partials/logos; and its height in px, set by eye so
# every mark sits at one optical size and none outweighs the rest. The page
# sorts the row by name, whatever the order here. A mark is the organization's
# own file from its press kit, recoloured to currentColor and never redrawn.
[params.thanks]
  orgs = [
    { name = "Browserbase", logo = "browserbase", height = 21 },
    { name = "Datadog",     logo = "datadog",     height = 20.5 },
    { name = "Docker",      logo = "docker",      height = 17 },
    { name = "Keycard",     logo = "keycard",     height = 17.5 },
    { name = "Snyk",        logo = "snyk",        height = 26 },
    { name = "Socket",      logo = "socket",      height = 19 },
    { name = "Tessl",       logo = "tessl",       height = 22 },
  ]

# The event strip and the closing block render only while `until` is in the
# future AT BUILD TIME. The site is static, so after `until` passes they stay
# up until the next production deploy. On 14 October 2026: push anything, or
# redeploy from the Vercel dashboard, and they are gone.
[params.event]
  id    = "sf-show-and-tell-2026"
  label = "Live · New York"
  say   = "Secure Software Factory Show and Tell, 13 October at Elsie Rooftop. Bring the factory a hard question."
  cta   = "RSVP"
  url   = "https://luma.com/keycard-rg1c"
  # RFC 3339 with the New York offset. A bare date is parsed as midnight UTC,
  # which is 8pm on launch night in New York: a deploy that evening would have
  # pulled the strip and the closing block while the room was still full. The
  # site sets no timeZone (a root key, and it would change how every date on
  # the site is read), so the offset lives on the value. Still EDT on
  # 14 October; US clocks change on 1 November.
  until = "2026-10-14T06:00:00-04:00"
  # The closing block renders from the same table, so the strip and the block
  # expire together and can never disagree about the event.
  pull  = "Filing an issue is the durable way to disagree with a paper. Being in the room is the faster one."
  when  = "Tuesday 13 October 2026 · from 5:30 pm · launch night"
  where = "Elsie Rooftop, 1412 Broadway, New York"
  what  = "Secure Software Factory Show and Tell"
  who   = "A panel moderated by Allie Howe, with Dick Hardt, co-author of OAuth 2.0, and speakers from Keycard, Socket, Docker and Braintrust, then live demos"
